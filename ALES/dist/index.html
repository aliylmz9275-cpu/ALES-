<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALES" />
    <title>ALES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- ─── BIG ALES / PUTER SDK ────────────────────────────────────────
         NEDEN BURADA (backend'de DEGIL): Puter'in "User Pays" modeli
         TARAYICI TARAFLIDIR — kimlik dogrulama puter.com'a acilan bir
         giris penceresidir ve jeton o kaynagin deposunda yasar. Python'dan
         cagrilabilecek anahtarsiz bir sunucu ucu YOK. Electron'un arayuz
         katmani gercek bir tarayici oldugu icin cagrinin ait oldugu yer
         burasi; backend yalnizca istegi buraya iletir ve sonucu alir
         (bkz. backend/puter_connector.py).
         async DEGIL, normal <script>: puter global'i React yuklenmeden
         hazir olsun ki ilk 'puter_call' mesaji kacmasin.
         CEVRIMDISI: dosya inmezse window.puter tanimsiz kalir; kopru bunu
         "Puter SDK yuklenemedi" olarak backend'e bildirir ve ALES normal
         zincirle calismaya DEVAM eder (fail-open). -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; background: #000; overflow: hidden; }

      /* ─── METIN KESKINLIGI ───────────────────────────────────────────
         font-smoothing: iOS Safari ve macOS'ta metni gri tonlamali
         yumusatmaya alir (telefondan / "ana ekrana ekle" ile acildiginda
         gorunur fark eder). Windows'ta Chromium bu ozelligi UYGULAMAZ --
         orada keskinligi belirleyen sey metnin BILESIK KATMANDA olup
         olmadigi; onun icin App.jsx'te ust bar/sekme/alt barin
         backdrop-filter'i kaldirildi (bkz. oradaki not).
         text-size-adjust: iOS yatay cevirince yaziyi kendiliginden
         buyutmesin -- buyutulen yazi bulanik gorunuyordu. */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* Yedek yazi tipi zinciri: Google Fonts CDN'i cevrimdisiyken (ALES.exe
         internetsiz de calisir) Inter/Share Tech Mono inmez. Zincir olmadan
         tarayici kendi varsayilanina duser ve metin belirgin sekilde
         degisir. Sistem yazi tipleri en yakin gorunumu verir. */
      body {
        font-family: Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui,
                     -apple-system, Roboto, Helvetica, Arial, sans-serif;
      }

      /* Kaydirma cubugu: yuksek DPI'da (Windows %125/%150) tam sayi
         cihaz pikseline oturan degerler src/index.css'te bu kurali
         ezer. Ikisini birlikte degistirin. */
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-thumb { background: #ffffff44; border-radius: 2px; }
    </style>
    <script type="module" crossorigin src="./assets/index-P1DLfLmP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B3K0vucY.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Sadece gercek http/https uzerinden acildiginda (telefon/tarayici)
      // kaydet - Electron file:// icinde service worker desteklenmiyor
      // ve zaten gerek yok (masaustunde localhost backend'ine dogrudan baglanir).
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
